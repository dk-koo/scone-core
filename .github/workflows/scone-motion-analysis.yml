name: SCONE motion analysis (OSS smoke tests)
on:
  push:
    paths:
      - 'research_tools/scone-motion-analysis/**'
      - '.github/workflows/scone-motion-analysis.yml'
  pull_request:
    paths:
      - 'research_tools/scone-motion-analysis/**'
      - '.github/workflows/scone-motion-analysis.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research_tools/scone-motion-analysis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies for bounded software tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy matplotlib seaborn plotly openpyxl xlrd pytest
      - name: Compile source files
        run: python -m compileall -q main.py src utils config visualization
      - name: Run targeted parsing and unit tests
        env:
          MPLBACKEND: Agg
        run: python -m pytest tests/test_data_loading.py tests/test_math_utils.py tests/test_unit_utils.py -q
